<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f35">
  <title>404 — Halaman Tidak Ditemukan | Rattilil Qur'an</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('rattilil-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('theme-dark');
      }
    })();
  </script>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <div class="page-wrapper" style="justify-content:center">
    <div class="container" style="text-align:center;max-width:480px">

      <header class="site-header">
        <img
          src="https://raw.githubusercontent.com/rattililquran/rattililquran.github.io/main/assets/images/logo-abu.png"
          alt="Logo Rattilil Qur'an"
          class="site-logo"
        >
      </header>

      <!-- 404 Illustration -->
      <div style="font-size:5rem;margin-bottom:8px;line-height:1">📖</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:5rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px">
        404
      </div>

      <h1 style="font-size:1.2rem;font-weight:800;color:var(--ink);margin-bottom:8px">
        Halaman Tidak Ditemukan
      </h1>

      <p style="font-size:0.88rem;color:var(--ink-3);line-height:1.7;margin-bottom:8px">
        Maaf, halaman yang Anda cari tidak ada atau telah dipindahkan.
      </p>

      <!-- Ayat motivasi -->
      <div style="background:linear-gradient(135deg,#fff8f0,#fff3e0);border:1.5px solid #fde68a;border-radius:var(--r);padding:16px;margin:20px 0;text-align:center">
        <div style="font-family:'Amiri',serif;font-size:1.1rem;color:#92400e;line-height:2;margin-bottom:6px">
          إِنَّ مَعَ الْعُسْرِ يُسْرًا
        </div>
        <div style="font-size:0.78rem;color:#78350f;font-style:italic">
          "Sesungguhnya bersama kesulitan ada kemudahan." (QS. Al-Insyirah: 6)
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:center;margin-top:24px">
        <a href="index.html" class="btn btn-primary" style="flex:1;max-width:200px">
          Daftar Sekarang
        </a>
        <a href="https://rattililquran.github.io/" class="btn btn-secondary" style="flex:1;max-width:200px">
          Ke Beranda
        </a>
      </div>

      <div style="margin-top:16px">
        <a href="status.html" class="btn btn-ghost" style="font-size:0.82rem">
          Cek Status Pendaftaran →
        </a>
      </div>

    </div>
  </div>

  <footer class="site-footer" style="position:relative;z-index:1">
    <p>© <span id="tahun-footer"></span> Rattilil Qur'an</p>
  </footer>

  <script>
    document.getElementById('tahun-footer').textContent = new Date().getFullYear();
  </script>
</body>
</html>
