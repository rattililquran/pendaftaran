<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f35">
  <title>Login Admin — Rattilil Qur'an</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <img
        src="https://raw.githubusercontent.com/rattililquran/rattililquran.github.io/main/assets/images/logo-abu.png"
        alt="Logo Rattilil Qur'an"
        class="login-logo"
      >
      <h1 class="login-title">Portal Admin</h1>
      <p class="login-subtitle">Rattilil Qur'an — Pendaftaran Murid Baru</p>

      <div class="alert alert-error" id="alert-login" role="alert" style="display:none">
        <span>⚠</span>
        <span id="alert-login-msg">Password salah.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password Admin</label>
        <input
          class="form-input"
          type="password"
          id="password"
          placeholder="Masukkan password admin"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="btn btn-primary" id="btn-login" onclick="login()">
        <div class="spinner" aria-hidden="true"></div>
        <span class="btn-text">Masuk</span>
      </button>

      <p style="text-align:center; margin-top:20px; font-size:0.8rem; color:var(--ink-4)">
        <a href="../index.html" style="color:var(--primary)">← Kembali ke Form Pendaftaran</a>
      </p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
